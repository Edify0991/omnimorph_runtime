joint_motor_test:
  # Use 1000 + test_mode_id to switch+start, or 2000 + test_mode_id to switch only.
  test_mode_id: 90
  control_hz: 500.0
  # By default the test runner resolves its joint layout from this deploy config
  # and the selected test_mode_id. Override joint_names below only when you need
  # a custom subset/order that is different from the deploy profile.
  deploy_config_path: ""
  joint_names: []

  # file / sine
  # Default to sine so launch can run out-of-box without a trajectory file.
  trajectory_source: sine

  # csp / cst / r1
  control_mode: csp

  # Offline reference trajectory file.
  # Supported row formats:
  # - N      cols: q[N]
  # - N + 1  cols: time + q[N]
  # - 2N     cols: q[N] + dq[N]
  # - 2N + 1 cols: time + q[N] + dq[N]
  # - 3N     cols: q[N] + dq[N] + tau[N]
  # - 3N + 1 cols: time + q[N] + dq[N] + tau[N]
  # where N is the resolved active joint count.
  trajectory_file: ""

  loop_trajectory: true
  restart_trajectory_on_enter_running: true

  # Lifecycle behavior (shared state machine).
  startup_completion_action: hold
  zeroing_duration_s: 2.0
  zero_pose: [0.0]

  # Fallback gains used when control_mode=cst/r1 and trajectory tau is not provided.
  fallback_kp: [60.0]
  fallback_kd: [2.0]
  tau_limit: [120.0]
  strict_safety_checks: true
  max_abs_q: 6.5
  max_abs_dq: 40.0
  max_abs_tau: 200.0

  # Structured logging.
  save_data: true
  data_path: ""

  # Sine generator settings (used when trajectory_source=sine).
  sine:
    duration_sec: 12.0
    offset: [0.0]
    amplitude: [0.10]
    period_sec: [2.0]
    phase_rad: [0.0]

    # all / sequential
    activation_mode: all
    # Leave empty to use [0 .. N-1] automatically.
    sequential_joint_order: []
    sequential_segment_sec: 2.0

    # Export generated sine reference trajectory CSV.
    export_reference_path: ""
