observation_manifest:
  schema_version: 3
  profile: "amp_tienkunglab_jc01_full_body_28dof"
  # One policy frame:
  #   base_ang_vel(3) + projected_gravity(3) + command(3)
  #   + joint_pos(28) + joint_vel(28) + last_action(28)
  #   + gait_phase_sin(2) + gait_phase_cos(2) + gait_phase_ratio(2) = 99
  # The policy stacks 10 frames, so the ONNX input is 990.
  terms:
    - name: base_ang_vel
      enabled: true
      count: 3
    - name: projected_gravity
      enabled: true
      count: 3
    - name: command
      enabled: true
      components: [vx, vy, dyaw]
    - name: joint_pos
      enabled: true
      count: 28
    - name: joint_vel
      enabled: true
      count: 28
    - name: last_action
      enabled: true
      count: 28
    # - name: gait_phase_sin
    #   enabled: true
    #   count: 2
    # - name: gait_phase_cos
    #   enabled: true
    #   count: 2
    # - name: gait_phase_ratio
    #   enabled: true
    #   count: 2
