opentrack_g1_generalist_tracker:
  # Any2Track/OpenTrack generalist tracker.
  # Model path:
  #   /home/edify/Code/OpenTrack/storage/logs/dagger/general_tracker_lafan1_v2/model.onnx
  # ONNX IO:
  #   obs[1,156] -> continuous_actions[1,29]
  #
  # This profile expects a runtime .npz reference file generated by
  # tools/convert_motion_npz_to_g1_reference.py.
  # The default workspace-local target is:
  #   ${omnimorph_root_dir}/data/reference_motion/opentrack/dance2_subject5_runtime.npz
  policy_name: general_tracker_lafan1_v2
  policy_family: opentrack_tracker
  policy_adapter: onnx
  policy_file: policies/opentrack_g1_generalist.onnx
  inference_strategy: sync_step
  obs_stack_N: 1
  cycle_time: 1.0

  joint_order: &g1_opentrack_full_body_joint_order
    - left_hip_pitch_joint
    - left_hip_roll_joint
    - left_hip_yaw_joint
    - left_knee_joint
    - left_ankle_pitch_joint
    - left_ankle_roll_joint
    - right_hip_pitch_joint
    - right_hip_roll_joint
    - right_hip_yaw_joint
    - right_knee_joint
    - right_ankle_pitch_joint
    - right_ankle_roll_joint
    - waist_yaw_joint
    - waist_roll_joint
    - waist_pitch_joint
    - left_shoulder_pitch_joint
    - left_shoulder_roll_joint
    - left_shoulder_yaw_joint
    - left_elbow_joint
    - left_wrist_roll_joint
    - left_wrist_pitch_joint
    - left_wrist_yaw_joint
    - right_shoulder_pitch_joint
    - right_shoulder_roll_joint
    - right_shoulder_yaw_joint
    - right_elbow_joint
    - right_wrist_roll_joint
    - right_wrist_pitch_joint
    - right_wrist_yaw_joint

  kps: &opentrack_tracker_kps
    left_hip_pitch_joint: 100.0
    left_hip_roll_joint: 100.0
    left_hip_yaw_joint: 100.0
    left_knee_joint: 200.0
    left_ankle_pitch_joint: 80.0
    left_ankle_roll_joint: 20.0
    right_hip_pitch_joint: 100.0
    right_hip_roll_joint: 100.0
    right_hip_yaw_joint: 100.0
    right_knee_joint: 200.0
    right_ankle_pitch_joint: 80.0
    right_ankle_roll_joint: 20.0
    waist_yaw_joint: 300.0
    waist_roll_joint: 300.0
    waist_pitch_joint: 300.0
    left_shoulder_pitch_joint: 90.0
    left_shoulder_roll_joint: 60.0
    left_shoulder_yaw_joint: 20.0
    left_elbow_joint: 60.0
    left_wrist_roll_joint: 20.0
    left_wrist_pitch_joint: 20.0
    left_wrist_yaw_joint: 20.0
    right_shoulder_pitch_joint: 90.0
    right_shoulder_roll_joint: 60.0
    right_shoulder_yaw_joint: 20.0
    right_elbow_joint: 60.0
    right_wrist_roll_joint: 20.0
    right_wrist_pitch_joint: 20.0
    right_wrist_yaw_joint: 20.0
  kds: &opentrack_tracker_kds
    left_hip_pitch_joint: 2.0
    left_hip_roll_joint: 2.0
    left_hip_yaw_joint: 2.0
    left_knee_joint: 4.0
    left_ankle_pitch_joint: 2.0
    left_ankle_roll_joint: 1.0
    right_hip_pitch_joint: 2.0
    right_hip_roll_joint: 2.0
    right_hip_yaw_joint: 2.0
    right_knee_joint: 4.0
    right_ankle_pitch_joint: 2.0
    right_ankle_roll_joint: 1.0
    waist_yaw_joint: 10.0
    waist_roll_joint: 10.0
    waist_pitch_joint: 10.0
    left_shoulder_pitch_joint: 2.0
    left_shoulder_roll_joint: 2.0
    left_shoulder_yaw_joint: 1.0
    left_elbow_joint: 1.0
    left_wrist_roll_joint: 1.0
    left_wrist_pitch_joint: 1.0
    left_wrist_yaw_joint: 1.0
    right_shoulder_pitch_joint: 2.0
    right_shoulder_roll_joint: 2.0
    right_shoulder_yaw_joint: 1.0
    right_elbow_joint: 1.0
    right_wrist_roll_joint: 1.0
    right_wrist_pitch_joint: 1.0
    right_wrist_yaw_joint: 1.0
  zeroing_kps: *opentrack_tracker_kps
  zeroing_kds: *opentrack_tracker_kds
  tau_limit: &opentrack_tracker_tau_limit
    left_hip_pitch_joint: 88.0
    left_hip_roll_joint: 88.0
    left_hip_yaw_joint: 88.0
    left_knee_joint: 139.0
    left_ankle_pitch_joint: 50.0
    left_ankle_roll_joint: 50.0
    right_hip_pitch_joint: 88.0
    right_hip_roll_joint: 88.0
    right_hip_yaw_joint: 88.0
    right_knee_joint: 139.0
    right_ankle_pitch_joint: 50.0
    right_ankle_roll_joint: 50.0
    waist_yaw_joint: 88.0
    waist_roll_joint: 50.0
    waist_pitch_joint: 50.0
    left_shoulder_pitch_joint: 25.0
    left_shoulder_roll_joint: 25.0
    left_shoulder_yaw_joint: 25.0
    left_elbow_joint: 25.0
    left_wrist_roll_joint: 25.0
    left_wrist_pitch_joint: 5.0
    left_wrist_yaw_joint: 5.0
    right_shoulder_pitch_joint: 25.0
    right_shoulder_roll_joint: 25.0
    right_shoulder_yaw_joint: 25.0
    right_elbow_joint: 25.0
    right_wrist_roll_joint: 25.0
    right_wrist_pitch_joint: 5.0
    right_wrist_yaw_joint: 5.0

  clip_observations: 100.0
  clip_actions: 100.0
  action_scale: 1.0
  action_target_anchor: reference_joint_pos
  device_id: 0
  obs_dim: 156
  action_dim: 29
  motor_N: 29
  RL_control_f: 50
  solver_control_hz: 200
  action_joint_order: *g1_opentrack_full_body_joint_order
  obs_joint_order: *g1_opentrack_full_body_joint_order
  reference_joint_order: *g1_opentrack_full_body_joint_order
  installed_joint_run_modes:
    left_hip_pitch_joint: r1
    left_hip_roll_joint: r1
    left_hip_yaw_joint: r1
    left_knee_joint: r1
    left_ankle_pitch_joint: r1
    left_ankle_roll_joint: r1
    right_hip_pitch_joint: r1
    right_hip_roll_joint: r1
    right_hip_yaw_joint: r1
    right_knee_joint: r1
    right_ankle_pitch_joint: r1
    right_ankle_roll_joint: r1
    waist_yaw_joint: r1
    waist_roll_joint: r1
    waist_pitch_joint: r1
    left_shoulder_pitch_joint: r1
    left_shoulder_roll_joint: r1
    left_shoulder_yaw_joint: r1
    left_elbow_joint: r1
    left_wrist_roll_joint: r1
    left_wrist_pitch_joint: r1
    left_wrist_yaw_joint: r1
    right_shoulder_pitch_joint: r1
    right_shoulder_roll_joint: r1
    right_shoulder_yaw_joint: r1
    right_elbow_joint: r1
    right_wrist_roll_joint: r1
    right_wrist_pitch_joint: r1
    right_wrist_yaw_joint: r1
  realtime:
    enabled: true
    lock_memory: true
    set_affinity: true
    cpu_id: 3
    use_fifo: true
    fifo_priority: 90

  observation_manifest_file: observation_manifest_opentrack_g1_generalist_tracker.yaml
  enable_reference_motion: true
  reference_motion_dim: 5
  reference_motion_sampling: step
  reference_motion_source: file
  reference_motion_path: ${omnimorph_root_dir}/data/reference_motion/opentrack/111_40_poses_120_runtime.npz

  source_contract:
    reference_file:
      reference_motion_key: reference_motion
      reference_joint_pos_key: joint_pos
      reference_joint_vel_key: joint_vel
      body_quat_order: wxyz
      body_quat_representation: quat
      body_quat_frame: world
    imu_input:
      source_type: unitree_sdk2_lowstate
      topic: rt/lowstate
      follow_unitree_transport: true
      payload: euler_compat
      euler_order: [roll, pitch, yaw]
      euler_unit: rad
      quat_order: xyzw
      ang_vel_order: [x, y, z]
      frame_alignment_rpy: [0.0, 0.0, 0.0]
    sim_base:
      quat_source_order: wxyz
  observation_contract:
    canonical:
      joint_order: robot_global_joint_order
      quat_order: xyzw
      quat_representation: quat
      body_quat_frame: world
      body_orientation_representation: rot6

  onnx_intra_threads: 1
  onnx_inter_threads: 1
  onnx_execution_providers: [cpu]
  policy_io:
    obs_input_name: obs
    action_output_name: continuous_actions
    enable_time_step_input: false
    time_step_input_name: time_step
    time_step_start: 0
    strict_model_io: true
    enable_metadata_check: false
    metadata_check_strict: true
    required_metadata_keys: []
    expected_metadata: {}
    reset_policy_on_mode_switch: true
    extra_output_names: []
    onnx_inputs: []

  enable_cmd_watchdog: false
  cmd_timeout_s: 0.12
  loop_overrun_warn_us: 2000
  enable_state_telemetry: true
  state_telemetry_hz: 50.0
  startup_completion_action: hold
  zeroing_run_mode: r1
  policy_startup_warmup_steps: 0
  seed_running_start_observation_from_reference: false
  zeroing_duration_s: 5.0
  zeroing_position_tolerance: 100.0
  zeroing_velocity_tolerance: 100.0
  control_mode: sim2real
  action_filter: 0.0

  robot:
    default_joint_angles: &opentrack_tracker_default_joint_angles
      left_hip_pitch_joint: -0.1
      left_hip_roll_joint: 0.0
      left_hip_yaw_joint: 0.0
      left_knee_joint: 0.3
      left_ankle_pitch_joint: -0.2
      left_ankle_roll_joint: 0.0
      right_hip_pitch_joint: -0.1
      right_hip_roll_joint: 0.0
      right_hip_yaw_joint: 0.0
      right_knee_joint: 0.3
      right_ankle_pitch_joint: -0.2
      right_ankle_roll_joint: 0.0
      waist_yaw_joint: 0.0
      waist_roll_joint: 0.0
      waist_pitch_joint: 0.0
      left_shoulder_pitch_joint: 0.2
      left_shoulder_roll_joint: 0.3
      left_shoulder_yaw_joint: 0.0
      left_elbow_joint: 1.28
      left_wrist_roll_joint: 0.0
      left_wrist_pitch_joint: 0.0
      left_wrist_yaw_joint: 0.0
      right_shoulder_pitch_joint: 0.2
      right_shoulder_roll_joint: -0.3
      right_shoulder_yaw_joint: 0.0
      right_elbow_joint: 1.28
      right_wrist_roll_joint: 0.0
      right_wrist_pitch_joint: 0.0
      right_wrist_yaw_joint: 0.0
    zero_joint_angles: *opentrack_tracker_default_joint_angles
    joint_limit_range:
      left_hip_pitch_joint: [-2.5307, 2.8798]
      left_hip_roll_joint: [-0.5236, 2.9671]
      left_hip_yaw_joint: [-2.7576, 2.7576]
      left_knee_joint: [-0.087267, 2.8798]
      left_ankle_pitch_joint: [-0.87267, 0.5236]
      left_ankle_roll_joint: [-0.2618, 0.2618]
      right_hip_pitch_joint: [-2.5307, 2.8798]
      right_hip_roll_joint: [-2.9671, 0.5236]
      right_hip_yaw_joint: [-2.7576, 2.7576]
      right_knee_joint: [-0.087267, 2.8798]
      right_ankle_pitch_joint: [-0.87267, 0.5236]
      right_ankle_roll_joint: [-0.2618, 0.2618]
      waist_yaw_joint: [-2.618, 2.618]
      waist_roll_joint: [-0.52, 0.52]
      waist_pitch_joint: [-0.52, 0.52]
      left_shoulder_pitch_joint: [-3.0892, 2.6704]
      left_shoulder_roll_joint: [-1.5882, 2.2515]
      left_shoulder_yaw_joint: [-2.618, 2.618]
      left_elbow_joint: [-1.0472, 2.0944]
      left_wrist_roll_joint: [-1.97222, 1.97222]
      left_wrist_pitch_joint: [-1.61443, 1.61443]
      left_wrist_yaw_joint: [-1.61443, 1.61443]
      right_shoulder_pitch_joint: [-3.0892, 2.6704]
      right_shoulder_roll_joint: [-2.2515, 1.5882]
      right_shoulder_yaw_joint: [-2.618, 2.618]
      right_elbow_joint: [-1.0472, 2.0944]
      right_wrist_roll_joint: [-1.97222, 1.97222]
      right_wrist_pitch_joint: [-1.61443, 1.61443]
      right_wrist_yaw_joint: [-1.61443, 1.61443]
    motor_torque_limit: *opentrack_tracker_tau_limit

  scales:
    lin_vel: 1.0
    ang_vel: 0.05
    dof_pos: 1.0
    dof_vel: 0.05
    quat: 1.0
    height_measurements: 1.0
    command_lin_vel: 1.0
    command_ang_vel: 1.0
  gait:
    gait_phase_offset_l: 0.0
    gait_phase_offset_r: 0.5
    gait_cycle: 1.0
    foot_height: 0.0
