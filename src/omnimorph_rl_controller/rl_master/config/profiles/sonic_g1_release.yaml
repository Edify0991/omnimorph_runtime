  realtime:
    enabled: true
    lock_memory: true
    set_affinity: true
    cpu_id: 3
    use_fifo: true
    fifo_priority: 90

  observation_manifest_file: observation_manifest_sonic_g1_release.yaml
  enable_reference_motion: true
  reference_motion_dim: 0
  reference_motion_sampling: step
  reference_motion_step_offset: 0
  reference_motion_source: file
  reference_motion_path: ${omnimorph_root_dir}/data/reference_motion/sonic/example_runtime.npz

  source_contract:
    reference_file:
      reference_motion_key: reference_motion
      reference_joint_pos_key: joint_pos
      reference_joint_vel_key: joint_vel
      reference_body_pos_w_key: body_pos_w
      reference_body_quat_w_key: body_quat_w
      body_quat_order: wxyz
      body_quat_representation: quat
      body_quat_frame: world
    imu_input:
      source_type: unitree_sdk2_lowstate
      topic: rt/lowstate
      follow_unitree_transport: true
      payload: euler_compat
      euler_order: [roll, pitch, yaw]
      euler_unit: rad
      quat_order: xyzw
      ang_vel_order: [x, y, z]
      frame_alignment_rpy: [0.0, 0.0, 0.0]
    sim_base:
      quat_source_order: wxyz
  observation_contract:
    canonical:
      joint_order: robot_global_joint_order
      quat_order: xyzw
      quat_representation: quat
      body_quat_frame: world
      body_orientation_representation: rot6

  onnx_intra_threads: 1
  onnx_inter_threads: 1
  onnx_execution_providers: [tensorrt, cuda, cpu]
  onnx_fail_on_provider_error: false
  onnx_log_inference_timing: true
  onnx_cuda_arena_extend_strategy: 1
  onnx_cuda_do_copy_in_default_stream: true
  onnx_tensorrt_fp16_enable: false
  onnx_tensorrt_int8_enable: false
  onnx_tensorrt_engine_cache_enable: true
  onnx_tensorrt_engine_cache_path: /tmp/sonic_g1_ort_trt_cache
  onnx_tensorrt_max_workspace_size: 2147483648
  policy_io:
    obs_input_name: obs_dict
    action_output_name: action
    enable_time_step_input: false
    time_step_input_name: time_step
    time_step_start: 0
    strict_model_io: true
    enable_metadata_check: false
    metadata_check_strict: true
    required_metadata_keys: []
    expected_metadata: {}
    reset_policy_on_mode_switch: true
    extra_output_names: []
    onnx_inputs:
      - name: obs_dict
        source: stacked_observation
        shape: [1, 994]
  sub_models:
    - name: encoder
      enabled: true
      weight: 1.0
      action_dim: 64
      policy_file: ${gr00t_wholebodycontrol_dir}/model_encoder.onnx
      policy_io:
        obs_input_name: obs_dict
        action_output_name: encoded_tokens
        strict_model_io: true
        enable_time_step_input: false
        extra_output_names: []
        onnx_inputs:
          - name: obs_dict
            source: feature_concat
            feature_names:
              - encoder_mode_4
              - motion_joint_positions_10frame_step5
              - motion_joint_velocities_10frame_step5
              - motion_root_z_position_10frame_step5
              - motion_root_z_position
              - motion_anchor_orientation
              - motion_anchor_orientation_10frame_step5
              - motion_joint_positions_lowerbody_10frame_step5
              - motion_joint_velocities_lowerbody_10frame_step5
              - vr_3point_local_target
              - vr_3point_local_orn_target
              - smpl_joints_10frame_step1
              - smpl_anchor_orientation_10frame_step1
              - motion_joint_positions_wrists_10frame_step1
            shape: [1, 1762]

  enable_cmd_watchdog: false
  cmd_timeout_s: 0.12
  loop_overrun_warn_us: 2000
  enable_state_telemetry: true
  state_telemetry_hz: 50.0
  startup_completion_action: hold
  zeroing_run_mode: r1
  policy_startup_warmup_steps: 0
  prefill_observation_history_on_running_start: false
  seed_running_start_observation_from_reference: false
  zeroing_duration_s: 5.0
  zeroing_position_tolerance: 100.0
  zeroing_velocity_tolerance: 100.0
  control_mode: sim2real
  action_filter: 0.0

  robot:
