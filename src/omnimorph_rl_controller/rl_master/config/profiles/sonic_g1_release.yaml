sonic_g1_release:
  # SONIC / GR00T Whole-Body Control G1 deploy profile.
  # Official deploy uses:
  #   decoder: /home/edify/Code/GR00T-WholeBodyControl/model_decoder.onnx
  #   encoder: /home/edify/Code/GR00T-WholeBodyControl/model_encoder.onnx
  #
  # This profile reads them directly from ${gr00t_wholebodycontrol_dir}.
  #
  # Decoder input: token_state(64) + 10 x proprioception(93) = 994
  # Decoder output: action[29] in IsaacLab G1 order
  # Encoder input: 1762D official release observation union
  # Encoder output: encoded_tokens[64]
