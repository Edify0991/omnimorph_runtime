    viewer_frame_topic: "/omnimorph/sim2sim/mujoco_viewer_frame"
    enable_python_viewer_inspector: false
    viewer_inspector_topic: "/omnimorph/sim2sim/mujoco_viewer_inspector"
    viewer_fps: 60.0
    viewer_inspector_hz: 10.0
    viewer_width: 1280
    viewer_height: 720
    viewer_title: "MuJoCo Sim2Sim Viewer"
    enable_state_telemetry: true
    state_telemetry_hz: 50.0
    show_left_ui: true
    show_right_ui: true

    use_command_torque_ff: false
