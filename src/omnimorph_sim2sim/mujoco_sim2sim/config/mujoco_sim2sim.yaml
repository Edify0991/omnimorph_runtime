mujoco_sim_bridge:
  ros__parameters:
    # Set path_variables in rl_cfg first, then point model_path at that variable.
    model_path: "${jc01_default_sim_xml}"

    # Base body used for fallback quaternion/angular-velocity extraction.
    base_body_name: "Body"
    # Optional free-joint name for base state extraction.
    base_free_joint_name: ""

    # C++ sim2sim no longer uses this field to override joint order.
    # The effective controlled joint order comes only from
    # rl_master.robot_global_joint_order / ModeProfileRegistry::jointOrder().
    # Keep this block aligned with the registry order for model mapping and
    # diagnostics. It is no longer a backend-specific override.
    joint_names:
      - "right_hip_roll"
      - "right_hip_yaw"
      - "right_hip_pitch"
      - "right_knee_pitch"
      - "right_ankle_pitch"
      - "right_ankle_roll"
      - "left_hip_roll"
      - "left_hip_yaw"
      - "left_hip_pitch"
      - "left_knee_pitch"
      - "left_ankle_pitch"
      - "left_ankle_roll"

    # If your actuator names differ from joint names, set them explicitly.
    actuator_names:
      - "motor_right_hip_roll"
      - "motor_right_hip_yaw"
      - "motor_right_hip_pitch"
      - "motor_right_knee_pitch"
      - "motor_right_ankle_pitch"
      - "motor_right_ankle_roll"
      - "motor_left_hip_roll"
      - "motor_left_hip_yaw"
      - "motor_left_hip_pitch"
      - "motor_left_knee_pitch"
      - "motor_left_ankle_pitch"
      - "motor_left_ankle_roll"

    # Hold parameters now always cover the full canonical joint set from
    # rl_master.robot_global_joint_order / ModeProfileRegistry::jointOrder().
    # In inactive/hold phases they apply to all canonical joints.
    # In policy RUNNING they apply only to canonical joints that are not in the
    # active profile's action_joint_order.
    # Hold target positions always come from the active mode profile's
    # robot.zero_joint_angles, resolved in canonical joint order.
    # PD gains are accepted only in per-joint named form, and they must cover
    # the full canonical joint set.
    # Example:
    # hold_kp:
    #   right_hip_roll: 80.0
    #   ...
    # hold_kd:
    #   right_hip_roll: 2.0
    #   ...
    # hold_torque_limit:
    #   right_hip_roll: 120.0
    #   ...
    #
    # Position actuators no longer have an independent sim-only tuning block.
    # The bridge rewrites their internal kp/kv/force limits dynamically:
    # - policy-controlled joints use the active mode profile kps/kds/tau_limit
    # - non-policy or inactive joints use hold_kp/hold_kd/hold_torque_limit

    # Control loop and sim integration.
    control_hz: 100.0
    sim_dt: 0.001
    command_timeout_sec: 0.1
    open_rl_enable_threshold: 1.0
    pause_when_no_command: false
    # hold_position / hold_last / zero_torque
    no_command_behavior: "hold_position"
    fix_base: false
    # Keep negative to preserve model initial height.
    fixed_base_height: -1.0
    # Sim-only startup / switching safety shell.
    enable_fixed_base_zeroing: true
    enable_fixed_base_hold_after_zeroing: true
    enable_release_before_running: true
    # Stay in hold for a few ticks after releasing the base, then allow running.
    post_release_settle_ticks: 20
    # Optional sim-only snap before fixed-base zeroing.
    enable_prepose_snap: false
    # If configured, size must be 1 or match joint_names.
    # prepose_joint_q: [0.0]
    enable_viewer: false
    # When true, C++ fused backend publishes full MuJoCo frame snapshots for
    # a separate Python viewer frontend. Use launch `backend:=python_frontend`
    # instead of setting this manually in normal workflows.
    enable_python_viewer_stream: false
    viewer_frame_topic: "/omnimorph/sim2sim/mujoco_viewer_frame"
    # When true, C++ fused backend publishes a human-readable runtime summary
    # for the Python frontend inspector.
    enable_python_viewer_inspector: false
    viewer_inspector_topic: "/omnimorph/sim2sim/mujoco_viewer_inspector"
    viewer_fps: 60.0
    viewer_inspector_hz: 10.0
    viewer_width: 1280
    viewer_height: 720
    viewer_title: "MuJoCo Sim2Sim Viewer"
    enable_state_telemetry: true
    state_telemetry_hz: 50.0
    # Python frontend viewer only.
    show_left_ui: true
    show_right_ui: true

    use_command_torque_ff: false
