    base_body_name: "Body"
    base_free_joint_name: ""

    # Must match rl_cfg_amp_mjlab_jc01_full_body.yaml robot_global_joint_order.
    joint_names:
      - "right_hip_roll"
      - "right_hip_yaw"
      - "right_hip_pitch"
