mujoco_sim_bridge:
  ros__parameters:
    model_path: "${jc01_fullbody_engineai_walk_xml}"

    base_body_name: "Body"
    base_free_joint_name: ""

    # C++ sim2sim no longer uses this field to override joint order.
    # The effective controlled joint order comes only from
    # rl_master.robot_global_joint_order / ModeProfileRegistry::jointOrder().
    # Keep this block aligned with the registry order for model mapping and
    # diagnostics. It is no longer a backend-specific override.
    joint_names:
      - "right_hip_roll"
      - "right_hip_yaw"
      - "right_hip_pitch"
      - "right_knee_pitch"
      - "right_ankle_pitch"
      - "right_ankle_roll"
      - "left_hip_roll"
      - "left_hip_yaw"
      - "left_hip_pitch"
      - "left_knee_pitch"
      - "left_ankle_pitch"
      - "left_ankle_roll"
      - "waist_roll"
      - "waist_yaw"
      - "right_shoulder_pitch"
      - "right_shoulder_roll"
      - "right_shoulder_yaw"
      - "right_elbow_pitch"
      - "right_elbow_yaw"
      - "right_wrist_pitch"
      - "right_wrist_roll"
      - "left_shoulder_pitch"
      - "left_shoulder_roll"
      - "left_shoulder_yaw"
      - "left_elbow_pitch"
      - "left_elbow_yaw"
      - "left_wrist_pitch"
      - "left_wrist_roll"

    actuator_names:
      - "motor_right_hip_roll"
      - "motor_right_hip_yaw"
      - "motor_right_hip_pitch"
      - "motor_right_knee_pitch"
      - "motor_right_ankle_pitch"
      - "motor_right_ankle_roll"
      - "motor_left_hip_roll"
      - "motor_left_hip_yaw"
      - "motor_left_hip_pitch"
      - "motor_left_knee_pitch"
      - "motor_left_ankle_pitch"
      - "motor_left_ankle_roll"
      - "motor_waist_roll"
      - "motor_waist_yaw"
      - "motor_right_shoulder_pitch"
      - "motor_right_shoulder_roll"
      - "motor_right_shoulder_yaw"
      - "motor_right_elbow_pitch"
      - "motor_right_elbow_yaw"
      - "motor_right_wrist_pitch"
      - "motor_right_wrist_roll"
      - "motor_left_shoulder_pitch"
      - "motor_left_shoulder_roll"
      - "motor_left_shoulder_yaw"
      - "motor_left_elbow_pitch"
      - "motor_left_elbow_yaw"
      - "motor_left_wrist_pitch"
      - "motor_left_wrist_roll"

    control_hz: 500.0
    sim_dt: 0.001
    command_timeout_sec: 0.1
    open_rl_enable_threshold: 1.0
    pause_when_no_command: false
    no_command_behavior: "hold_last"
    fix_base: false
    fixed_base_height: 0.65
    enable_fixed_base_zeroing: true
    enable_fixed_base_hold_after_zeroing: true
    enable_release_before_running: true
    post_release_settle_ticks: 200
    post_zeroing_hold_settle_ticks: 250
    enable_prepose_snap: false
    sim_only_force_policy_csp: true

    enable_viewer: false
    enable_python_viewer_stream: false
    viewer_frame_topic: "/humanoid/sim2sim/mujoco_viewer_frame"
    enable_python_viewer_inspector: false
    viewer_inspector_topic: "/humanoid/sim2sim/mujoco_viewer_inspector"
    viewer_fps: 60.0
    viewer_inspector_hz: 10.0
    viewer_width: 1280
    viewer_height: 720
    viewer_title: "MuJoCo Sim2Sim Viewer"
    enable_state_telemetry: true
    state_telemetry_hz: 50.0
    show_left_ui: true
    show_right_ui: true

    use_command_torque_ff: false
