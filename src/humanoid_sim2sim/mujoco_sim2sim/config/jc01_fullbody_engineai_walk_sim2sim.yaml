mujoco_sim_bridge:
  ros__parameters:
    model_path: "/home/edify/Code/jingchu01/JC01-7DOF-URDF/JC01-URDF-18所/jc01_fullbody_engineai_walk_sim2sim.xml"

    base_body_name: "Body"
    base_free_joint_name: ""

    # Keep this aligned with robot_global_joint_order.
    joint_names:
      - "right_hip_roll"
      - "right_hip_yaw"
      - "right_hip_pitch"
      - "right_knee_pitch"
      - "right_ankle_pitch"
      - "right_ankle_roll"
      - "left_hip_roll"
      - "left_hip_yaw"
      - "left_hip_pitch"
      - "left_knee_pitch"
      - "left_ankle_pitch"
      - "left_ankle_roll"
      - "waist_roll"
      - "waist_yaw"
      - "right_shoulder_pitch"
      - "right_shoulder_roll"
      - "right_shoulder_yaw"
      - "right_elbow_pitch"
      - "right_elbow_yaw"
      - "right_wrist_pitch"
      - "right_wrist_roll"
      - "left_shoulder_pitch"
      - "left_shoulder_roll"
      - "left_shoulder_yaw"
      - "left_elbow_pitch"
      - "left_elbow_yaw"
      - "left_wrist_pitch"
      - "left_wrist_roll"

    actuator_names:
      - "motor_right_hip_roll"
      - "motor_right_hip_yaw"
      - "motor_right_hip_pitch"
      - "motor_right_knee_pitch"
      - "motor_right_ankle_pitch"
      - "motor_right_ankle_roll"
      - "motor_left_hip_roll"
      - "motor_left_hip_yaw"
      - "motor_left_hip_pitch"
      - "motor_left_knee_pitch"
      - "motor_left_ankle_pitch"
      - "motor_left_ankle_roll"
      - "motor_waist_roll"
      - "motor_waist_yaw"
      - "motor_right_shoulder_pitch"
      - "motor_right_shoulder_roll"
      - "motor_right_shoulder_yaw"
      - "motor_right_elbow_pitch"
      - "motor_right_elbow_yaw"
      - "motor_right_wrist_pitch"
      - "motor_right_wrist_roll"
      - "motor_left_shoulder_pitch"
      - "motor_left_shoulder_roll"
      - "motor_left_shoulder_yaw"
      - "motor_left_elbow_pitch"
      - "motor_left_elbow_yaw"
      - "motor_left_wrist_pitch"
      - "motor_left_wrist_roll"

    control_hz: 500.0
    sim_dt: 0.001
    command_timeout_sec: 0.1
    open_rl_enable_threshold: 1.0
    pause_when_no_command: false
    no_command_behavior: "hold_position"
    fix_base: false
    fixed_base_height: 0.65
    enable_fixed_base_zeroing: true
    enable_fixed_base_hold_after_zeroing: true
    enable_release_before_running: true
    post_release_settle_ticks: 3000
    post_zeroing_hold_settle_ticks: 250
    enable_prepose_snap: false
    actuator_control_mode: "mixed"

    enable_viewer: false
    enable_python_viewer_stream: false
    viewer_frame_topic: "/humanoid/sim2sim/mujoco_viewer_frame"
    enable_python_viewer_inspector: false
    viewer_inspector_topic: "/humanoid/sim2sim/mujoco_viewer_inspector"
    viewer_fps: 60.0
    viewer_inspector_hz: 10.0
    viewer_width: 1280
    viewer_height: 720
    viewer_title: "MuJoCo Sim2Sim Viewer"
    enable_state_telemetry: true
    state_telemetry_hz: 50.0
    show_left_ui: true
    show_right_ui: true

    use_command_torque_ff: false
    # Phase-1 sim2sim alignment:
    # policy joints still follow the active profile action_joint_order and installed_joint_run_modes,
    # while the non-policy upper-body joints below are held from robot.zero_joint_angles.
    hold_target_source: "zero_joint_angles"
    position_actuator_joint_names:
      - "waist_roll"
      - "waist_yaw"
      - "right_shoulder_pitch"
      - "right_shoulder_roll"
      - "right_shoulder_yaw"
      - "right_elbow_pitch"
      - "right_elbow_yaw"
      - "right_wrist_pitch"
      - "right_wrist_roll"
      - "left_shoulder_pitch"
      - "left_shoulder_roll"
      - "left_shoulder_yaw"
      - "left_elbow_pitch"
      - "left_elbow_yaw"
      - "left_wrist_pitch"
      - "left_wrist_roll"
    position_actuator_kp:
      waist_roll: 300.0
      waist_yaw: 300.0
      right_shoulder_pitch: 220.0
      right_shoulder_roll: 220.0
      right_shoulder_yaw: 180.0
      right_elbow_pitch: 160.0
      right_elbow_yaw: 140.0
      right_wrist_pitch: 90.0
      right_wrist_roll: 90.0
      left_shoulder_pitch: 220.0
      left_shoulder_roll: 220.0
      left_shoulder_yaw: 180.0
      left_elbow_pitch: 160.0
      left_elbow_yaw: 140.0
      left_wrist_pitch: 90.0
      left_wrist_roll: 90.0
    position_actuator_kv:
      waist_roll: 20.0
      waist_yaw: 20.0
      right_shoulder_pitch: 14.0
      right_shoulder_roll: 14.0
      right_shoulder_yaw: 12.0
      right_elbow_pitch: 10.0
      right_elbow_yaw: 10.0
      right_wrist_pitch: 6.0
      right_wrist_roll: 6.0
      left_shoulder_pitch: 14.0
      left_shoulder_roll: 14.0
      left_shoulder_yaw: 12.0
      left_elbow_pitch: 10.0
      left_elbow_yaw: 10.0
      left_wrist_pitch: 6.0
      left_wrist_roll: 6.0
    position_actuator_forcerange:
      waist_roll: 130.0
      waist_yaw: 130.0
      right_shoulder_pitch: 80.0
      right_shoulder_roll: 80.0
      right_shoulder_yaw: 80.0
      right_elbow_pitch: 80.0
      right_elbow_yaw: 80.0
      right_wrist_pitch: 80.0
      right_wrist_roll: 80.0
      left_shoulder_pitch: 80.0
      left_shoulder_roll: 80.0
      left_shoulder_yaw: 80.0
      left_elbow_pitch: 80.0
      left_elbow_yaw: 80.0
      left_wrist_pitch: 80.0
      left_wrist_roll: 80.0
    hold_joint_names:
      - "waist_roll"
      - "waist_yaw"
      - "right_shoulder_pitch"
      - "right_shoulder_roll"
      - "right_shoulder_yaw"
      - "right_elbow_pitch"
      - "right_elbow_yaw"
      - "right_wrist_pitch"
      - "right_wrist_roll"
      - "left_shoulder_pitch"
      - "left_shoulder_roll"
      - "left_shoulder_yaw"
      - "left_elbow_pitch"
      - "left_elbow_yaw"
      - "left_wrist_pitch"
      - "left_wrist_roll"
    kp: [60.0]
    kd: [5.0]
    torque_limit: [120.0]
