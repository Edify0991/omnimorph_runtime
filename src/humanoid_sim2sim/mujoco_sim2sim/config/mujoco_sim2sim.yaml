mujoco_sim_bridge:
  ros__parameters:
    # Must be provided at launch time:
    # ros2 launch mujoco_sim2sim sim2sim_mujoco.launch.py model_path:=/abs/path/to/robot.xml
    model_path: "/home/edify/Code/jingchu01/JC01-7DOF-URDF/JC01-URDF-18所/jingchu01_new_0304.xml"

    # Base body used for fallback quaternion/angular-velocity extraction.
    base_body_name: "Body"
    # Optional free-joint name for base state extraction.
    base_free_joint_name: ""

    # RL joint order should stay consistent with rl_master canonical order.
    joint_names:
      - "right_hip_roll"
      - "right_hip_yaw"
      - "right_hip_pitch"
      - "right_knee_pitch"
      - "right_ankle_pitch"
      - "right_ankle_roll"
      - "left_hip_roll"
      - "left_hip_yaw"
      - "left_hip_pitch"
      - "left_knee_pitch"
      - "left_ankle_pitch"
      - "left_ankle_roll"

    # If your actuator names differ from joint names, set them explicitly.
    actuator_names:
      - "motor_right_hip_roll"
      - "motor_right_hip_yaw"
      - "motor_right_hip_pitch"
      - "motor_right_knee_pitch"
      - "motor_right_ankle_pitch"
      - "motor_right_ankle_roll"
      - "motor_left_hip_roll"
      - "motor_left_hip_yaw"
      - "motor_left_hip_pitch"
      - "motor_left_knee_pitch"
      - "motor_left_ankle_pitch"
      - "motor_left_ankle_roll"

    # Optional extra joints that are NOT controlled by RL policy outputs.
    # These joints will hold a fixed target (typically robot initial pose).
    # Example:
    # hold_joint_names: ["waist_yaw", "left_shoulder_pitch", "right_shoulder_pitch"]
    # hold_actuator_names: ["motor_waist_yaw", "motor_l_shoulder_pitch", "motor_r_shoulder_pitch"]
    # Leave these keys unset when not used. In some ROS2 parameter parser
    # combinations, explicit empty arrays may be treated as "not set" and
    # fail during node construction before user code runs.
    # hold_joint_names: ["waist_yaw", "left_shoulder_pitch", "right_shoulder_pitch"]
    # hold_actuator_names: ["motor_waist_yaw", "motor_l_shoulder_pitch", "motor_r_shoulder_pitch"]
    # If omitted, hold targets latch from model initial qpos at startup.
    # hold_joint_target_q: [0.0, 0.0, 0.0]
    # PD gains used only when actuator_control_mode resolves to torque.
    hold_kp: [80.0]
    hold_kd: [2.0]
    hold_torque_limit: [120.0]

    # Control loop and sim integration.
    control_hz: 100.0
    sim_dt: 0.001
    command_timeout_sec: 0.1
    open_rl_enable_threshold: 1.0
    pause_when_no_command: false
    # hold_position / hold_last / zero_torque
    no_command_behavior: "hold_position"
    fix_base: false
    # Keep negative to preserve model initial height.
    fixed_base_height: -1.0
    # auto / torque / position
    actuator_control_mode: "auto"
    enable_viewer: false
    # When true, C++ fused backend publishes full MuJoCo frame snapshots for
    # a separate Python viewer frontend. Use launch `backend:=python_frontend`
    # instead of setting this manually in normal workflows.
    enable_python_viewer_stream: false
    viewer_frame_topic: "/humanoid/sim2sim/mujoco_viewer_frame"
    # When true, C++ fused backend publishes a human-readable runtime summary
    # for the Python frontend inspector.
    enable_python_viewer_inspector: false
    viewer_inspector_topic: "/humanoid/sim2sim/mujoco_viewer_inspector"
    viewer_fps: 60.0
    viewer_inspector_hz: 10.0
    viewer_width: 1280
    viewer_height: 720
    viewer_title: "MuJoCo Sim2Sim Viewer"
    enable_state_telemetry: true
    state_telemetry_hz: 50.0
    # Python interactive backend only.
    show_left_ui: true
    show_right_ui: true

    # Joint-space stabilization for simulation side.
    use_command_torque_ff: false
    kp: [80.0]
    kd: [2.0]
    torque_limit: [120.0]
