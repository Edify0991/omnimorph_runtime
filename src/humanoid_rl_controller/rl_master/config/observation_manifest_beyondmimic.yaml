observation_manifest:
  schema_version: 3
  profile: "beyondmimic"
  # Default total dimension: 71 (47 + 24 reference_motion)
  # BeyondMimic-style extra terms are listed below with enabled=false templates.
  terms:
    - name: phase
      enabled: true
      count: 2
    - name: command
      enabled: true
      components: [vx, vy, dyaw]
    - name: joint_pos
      enabled: true
      count: 12
    - name: joint_vel
      enabled: true
      count: 12
    - name: last_action
      enabled: true
      count: 12
    - name: base_ang_vel
      enabled: true
      count: 3
    - name: base_rpy
      enabled: true
      count: 3
    - name: reference_motion
      enabled: true
      source: reference_motion
      count: 24
    - name: reference_joint_pos
      enabled: false
      source: reference_joint_pos
      count: 12
    - name: reference_joint_vel
      enabled: false
      source: reference_joint_vel
      count: 12
    - name: motion_anchor_pos_b
      enabled: false
      source: motion_anchor_pos_b
      count: 3
    - name: motion_anchor_ori_b
      enabled: false
      source: motion_anchor_ori_b
      count: 6
    - name: motion_body_pos_b
      enabled: false
      source: motion_body_pos_b
      count: 0 # set to 3 * body_count when enabled
    - name: motion_body_ori_b
      enabled: false
      source: motion_body_ori_b
      count: 0 # set to 6 * body_count when enabled
    - name: robot_body_pos
      enabled: false
      source: robot_body_pos
      count: 0 # set to 3 * body_count when enabled
    - name: robot_body_ori
      enabled: false
      source: robot_body_ori
      count: 0 # set to 6 * body_count when enabled
    # External sensor interface example:
    # - name: external_sensor
    #   enabled: true
    #   source: vision_latent
    #   count: 64
