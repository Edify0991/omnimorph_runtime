    - right_elbow_pitch
  onnx_intra_threads: 1
  onnx_inter_threads: 1
  policy_io:
    obs_input_name: obs
    action_output_name: actions
    enable_time_step_input: false
    time_step_input_name: time_step
    time_step_start: 0
    strict_model_io: false
    enable_metadata_check: true
    metadata_check_strict: true
    required_metadata_keys:
      - obs_dim
      - action_dim
    expected_metadata:
      obs_dim: "71"
      action_dim: "20"
    reset_policy_on_mode_switch: true
    extra_output_names: []
  enable_reference_motion: false
  reference_motion_dim: 0
  reference_motion_sampling: phase
  reference_motion_source: auto
  reference_anchor_body: base
  reference_body_names: []
  reference_joint_order:
    - right_hip_roll
    - right_hip_yaw
    - right_hip_pitch
    - right_knee_pitch
    - right_ankle_pitch
    - right_ankle_roll
    - left_hip_roll
