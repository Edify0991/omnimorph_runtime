  kds: [5, 3, 5, 10, 2, 2, 5, 3, 5, 10, 2, 2, 3, 2, 2, 1, 3, 2, 2, 1]

  clip_observations: 100.0
  clip_actions: 100.0
  action_scale: 0.5

  device_id: 0
  # 2 + 3 + 20 + 20 + 20 + 3 + 3 = 71
  obs_dim: 71
  action_dim: 20
  motor_N: 20
  RL_control_f: 100
  observation_manifest_file: "observation_manifest_full_body_example.yaml"

  # Replace these names with your real upper-body naming if different.
  action_joint_order:
    - right_hip_roll
    - right_hip_yaw
    - right_hip_pitch
    - right_knee_pitch
    - right_ankle_pitch
    - right_ankle_roll
    - left_hip_roll
    - left_hip_yaw
    - left_hip_pitch
    - left_knee_pitch
    - left_ankle_pitch
    - left_ankle_roll
