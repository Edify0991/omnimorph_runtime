# Root RL config index.

humanoid_rl_root_dir: /home/edify/Code/jc01_deploy/src/humanoid_rl_controller/rl_master
legged_gym_root_dir: /path/to/legged_gym_root_dir
robot_global_joint_order:
- right_hip_roll
- right_hip_yaw
- right_hip_pitch
- right_knee_pitch
- right_ankle_pitch
- right_ankle_roll
- left_hip_roll
- left_hip_yaw
- left_hip_pitch
- left_knee_pitch
- left_ankle_pitch
- left_ankle_roll
joint_groups:
  leg:
  - right_hip_roll
  - right_hip_yaw
  - right_hip_pitch
  - right_knee_pitch
  - right_ankle_pitch
  - right_ankle_roll
  - left_hip_roll
  - left_hip_yaw
  - left_hip_pitch
  - left_knee_pitch
  - left_ankle_pitch
  - left_ankle_roll
  arm: []
  waist: []
deploy_mode_profiles:
- mode_id: 0
  config_section: engineai_walk
  tag: vel_walk
- mode_id: 1
  config_section: engineai_stand
  tag: stand
- mode_id: 2
  config_section: beyondmimic_leg12_strict_walk2
  tag: beyondmimic_walk
config_files:
  beyondmimic_leg12_strict_walk2: profiles/beyondmimic_leg12_strict_walk2.yaml
  engineai_walk: profiles/engineai_walk.yaml
  engineai_full_body_example: profiles/engineai_full_body_example.yaml
  engineai_stand: profiles/stand_sim2real.yaml
runtime_process:
  controller:
    enabled: true
    lock_memory: true
    set_affinity: true
    cpu_id: 3
    use_fifo: true
    fifo_priority: 90
  solver:
    enabled: true
    lock_memory: true
    set_affinity: true
    cpu_id: 2
    use_fifo: true
    fifo_priority: 90
logging:
  enabled: true
  backend: mcap
  output_dir: data/runtime_logs
  session_name_policy: timestamp_policy
  custom_session_name: ''
  writer:
    queue_capacity: 256
    flush_period_ms: 250
    compression: zstd
    chunk_size_kb: 1024
  tick:
    enabled: true
    decimation: 1
    include_observation: true
    include_policy_action: true
    include_motor_io: true
    include_joint_targets: true
    include_external_observations: false
  events:
    enabled: true
  reference_motion:
    enabled: false
  source_samples:
    enabled: true
    include_base_imu: true
    include_external_observations: false
  export:
    default_format: none
