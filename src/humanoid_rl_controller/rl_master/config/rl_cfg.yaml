  enable_reference_motion: false
  reference_motion_dim: 0
  reference_motion_sampling: "phase"
  reference_motion_source: "auto"
  reference_anchor_body: "base"
  reference_body_names: []
  external_observations: []

  enable_cmd_watchdog: true
  cmd_timeout_s: 0.12
  loop_overrun_warn_us: 2000
  enable_state_telemetry: true
  state_telemetry_hz: 50.0
  auto_start_policy: true
  zeroing_duration_s: 2.0

  tau_limit: [130, 130, 130, 130, 130, 130, 130, 130, 130, 130, 130, 130, 60, 60, 60, 40, 60, 60, 60, 40]

  control_mode: "sim2real"
  action_filter: 0.2

  robot:
