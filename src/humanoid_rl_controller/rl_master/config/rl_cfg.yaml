      left_knee_pitch: 0.48
      left_ankle_pitch: -0.24
      left_ankle_roll: 0.0
    
    joint_limit_range:
      right_hip_roll: [-0.2, 0.2]
      right_hip_yaw: [-1.05, 1.05]
      right_hip_pitch: [-0.45, 0.38]
      right_knee_pitch: [0.0, 1.48]
      right_ankle_pitch: [-0.64, 0.4]
      right_ankle_roll: [-0.26, 0.26]
      left_hip_roll: [-0.2, 0.2]
      left_hip_yaw: [-1.05, 1.05]
      left_hip_pitch: [-0.45, 0.38]
      left_knee_pitch: [0.0, 1.48]
      left_ankle_pitch: [-0.64, 0.4]
      left_ankle_roll: [-0.26, 0.26]
      # hip_linear_motor: [0, 200]
      # knee_linear_motor: [0, 200]
      # ankle_left_linear_motor: [0, 100]
      # ankle_right_linear_motor: [0, 100]
    
    motor_torque_limit:
      right_hip_roll: 330
      right_hip_yaw: 150
      right_hip_pitch: 330
      right_knee_pitch: 8000
      right_ankle_pitch: 90
      right_ankle_roll: 90
      left_hip_roll: 330
      left_hip_yaw: 150
      left_hip_pitch: 330
      left_knee_pitch: 8000
      left_ankle_pitch: 90
      left_ankle_roll: 90
  
  scales:
    lin_vel: 2.0
    ang_vel: 1.0
    dof_pos: 1.0
    dof_vel: 0.05
    quat: 1.0
    height_measurements: 5.0

