# RL Configuration File

humanoid_rl_root_dir: "/home/edify/Code/jc01_deploy/src/humanoid_rl_controller/rl_master"
legged_gym_root_dir: "/path/to/legged_gym_root_dir"

# walk_mode DDS control words (generic):
# start specific mode: 1000 + mode_id
# set specific mode only: 2000 + mode_id
# lifecycle controls (canonical): 10=START_POLICY, 11=STOP_POLICY, 12=ZEROING, 13=ESTOP
# lifecycle controls (legacy, still accepted): 3001/3002/3003/3004
# note: direct mode switch by plain mode_id is disabled to avoid ambiguity

# Required explicit global runtime joint order.
# This is the single authoritative runtime joint space for all active modes.
# Every active mode must use only joints from this list.
robot_global_joint_order:
  - right_hip_roll
  - right_hip_yaw
  - right_hip_pitch
  - right_knee_pitch
  - right_ankle_pitch
  - right_ankle_roll
  - left_hip_roll
  - left_hip_yaw
  - left_hip_pitch
  - left_knee_pitch
  - left_ankle_pitch
  - left_ankle_roll

# Example 30-dim full-body extension template:
# robot_global_joint_order:
#   - right_hip_roll
#   - right_hip_yaw
#   - right_hip_pitch
#   - right_knee_pitch
#   - right_ankle_pitch
#   - right_ankle_roll
#   - left_hip_roll
#   - left_hip_yaw
#   - left_hip_pitch
#   - left_knee_pitch
#   - left_ankle_pitch
#   - left_ankle_roll
#   - waist_yaw
#   - waist_roll
#   - waist_pitch
#   - left_shoulder_pitch
#   - left_shoulder_roll
#   - left_shoulder_yaw
#   - left_elbow_pitch
#   - left_elbow_yaw
#   - left_wrist_pitch
#   - left_wrist_yaw
#   - right_shoulder_pitch
#   - right_shoulder_roll
#   - right_shoulder_yaw
#   - right_elbow_pitch
#   - right_elbow_yaw
#   - right_wrist_pitch
#   - right_wrist_yaw
#   - head_yaw

# Generic mode -> policy profile map. Add new mode_id entries for new scenes/models
# without changing controller source code.
deploy_mode_profiles:
  - mode_id: 0
    config_section: engineai_walk
    tag: vel_walk
  - mode_id: 1
    config_section: stand_sim2real
    tag: stand

# Process-level realtime overrides for thread scheduling and CPU affinity.
# These override per-profile `realtime` when present.
runtime_process:
  controller:
    enabled: true
    lock_memory: true
    set_affinity: true
    cpu_id: 3
    use_fifo: true
    fifo_priority: 90

logging:
  enabled: true
  backend: mcap
  output_dir: data/runtime_logs
  session_name_policy: timestamp_policy   # timestamp_policy / timestamp_mode / custom
  custom_session_name: ""
  writer:
    queue_capacity: 256
    flush_period_ms: 250
    compression: zstd   # none / zstd / lz4
    chunk_size_kb: 1024
  tick:
    enabled: true
    decimation: 1
    include_observation: true
    include_policy_action: true
    include_motor_io: true
    include_joint_targets: true
    include_external_observations: false
  events:
    enabled: true
  reference_motion:
    enabled: false
  amp:
    enabled: false
  source_samples:
    enabled: true
    include_base_imu: true
    include_external_observations: false
  export:
    default_format: none
  solver:
    enabled: true
    lock_memory: true
    set_affinity: true
    cpu_id: 2
    use_fifo: true
    fifo_priority: 90

engineai_walk:
  policy_name: "2026-04-09_15-00-05v2"
  policy_family: "velloco"  # amp / beyondmimic / custom
  obs_stack_N: 15
  # cycle_time: 1.05
  cycle_time: 1.0
  
  # PD controller gains

  # test pd
  kps:  [200, 120, 150, 300, 20, 20, 200, 120, 150, 300, 20, 20]   
  kds:  [5, 3, 5, 10, 2, 2, 5, 3, 5, 10, 2, 2]

  clip_observations: 100.0
  clip_actions: 100.0
  action_scale: 0.5
  
  device_id: 0
  obs_dim: 47
  action_dim: 12
  motor_N: 12
  RL_control_f: 100
  realtime:
    enabled: true
    lock_memory: true
    set_affinity: true
    cpu_id: 3
    use_fifo: true
    fifo_priority: 90
  # policy action output order. If omitted, default is robot canonical order.
  action_joint_order:
    - right_hip_roll
    - right_hip_yaw
    - right_hip_pitch
    - right_knee_pitch
    - right_ankle_pitch
    - right_ankle_roll
    - left_hip_roll
    - left_hip_yaw
    - left_hip_pitch
    - left_knee_pitch
    - left_ankle_pitch
    - left_ankle_roll
  obs_joint_order:
    - right_hip_roll
    - right_hip_yaw
    - right_hip_pitch
    - right_knee_pitch
    - right_ankle_pitch
    - right_ankle_roll
    - left_hip_roll
    - left_hip_yaw
    - left_hip_pitch
    - left_knee_pitch
    - left_ankle_pitch
    - left_ankle_roll
  # Example (IsaacLab left-first style), replace above list if needed:
  # action_joint_order:
  #   - left_hip_roll
  #   - left_hip_yaw
  #   - left_hip_pitch
  #   - left_knee_pitch
  #   - left_ankle_pitch
  #   - left_ankle_roll
  #   - right_hip_roll
  #   - right_hip_yaw
  #   - right_hip_pitch
  #   - right_knee_pitch
  #   - right_ankle_pitch
  #   - right_ankle_roll
  # obs_joint_order can use the same left-first list as action_joint_order.
  observation_manifest_file: "observation_manifest_velloco.yaml"
  # beyondmimic example:
  # policy_family: "beyondmimic"
  # observation_manifest_file: "observation_manifest_beyondmimic.yaml"
  # obs_dim: 71
  enable_reference_motion: false
  reference_motion_dim: 24
  reference_motion_sampling: "step"   # phase / step
  reference_motion_source: "auto"      # auto / file / policy_outputs
  reference_motion_file: "reference_motion/walk_ref.txt"
  reference_anchor_body: "base"
  reference_body_names: []             # e.g. ["base", "left_foot", "right_foot"]
  reference_joint_order:
    - right_hip_roll
    - right_hip_yaw
    - right_hip_pitch
    - right_knee_pitch
    - right_ankle_pitch
    - right_ankle_roll
    - left_hip_roll
    - left_hip_yaw
    - left_hip_pitch
    - left_knee_pitch
    - left_ankle_pitch
    - left_ankle_roll
  source_contract:
    imu_input:
      payload: "euler_compat"          # euler_compat / quaternion
      euler_order: ["roll", "pitch", "yaw"]
      euler_unit: "rad"                # rad / deg
      quat_order: "xyzw"               # only used when payload=quaternion
      ang_vel_order: ["x", "y", "z"]
      frame_alignment_rpy: [0.0, 0.0, 0.0]
    sim_base:
      quat_source_order: "wxyz"        # MuJoCo qpos free-joint source order
    reference_file:
      body_quat_order: "wxyz"
    policy_extra_outputs:
      body_quat_order: "wxyz"
  external_observations:
    - name: vision_latent
      dim: 64
      required: false
    - name: lidar_latent
      dim: 32
      required: false
    # Optional (BeyondMimic robot body local terms):
    # - name: robot_body_pos_w   # shape: 3 * body_count
    #   dim: 24
    #   required: false
    # - name: robot_body_quat_w  # shape: 4 * body_count, xyzw
    #   dim: 32
    #   required: false
  onnx_intra_threads: 1
  onnx_inter_threads: 1
  policy_io:
    obs_input_name: "obs"
    action_output_name: "actions"
    enable_time_step_input: false
    time_step_input_name: "time_step"
    time_step_start: 0
    strict_model_io: false
    enable_metadata_check: false
    metadata_check_strict: true
    required_metadata_keys: []
    expected_metadata: {}
    reset_policy_on_mode_switch: true
    extra_output_names: []
    onnx_inputs: []
    # Multi-input example:
    # onnx_inputs:
    #   - name: obs
    #     source: stacked_observation
    #     shape: [1, 705]
    #     fill_policy: error
    #   - name: reference_joint_pos
    #     source: feature
    #     feature_name: reference_joint_pos
    #     shape: [1, 12]
    #     fill_policy: error
    #   - name: time_step
    #     source: time_step
    #     shape: [1, 1]
    #     fill_policy: error
    # Example for beyondmimic-style exported policy:
    # obs_input_name: "obs"
    # action_output_name: "action"
    # enable_time_step_input: true
    # time_step_input_name: "time_step"
    # extra_output_names: ["joint_pos", "joint_vel", "body_pos_w", "body_quat_w"]
    # enable_metadata_check: true
    # metadata_check_strict: true
    # required_metadata_keys: ["obs_dim", "action_dim", "obs_stack_n"]
    # expected_metadata:
    #   obs_dim: "47"
    #   action_dim: "12"
    #   obs_stack_n: "15"
    #   obs_input_name: "obs"
    #   action_output_name: "actions"
  amp_discriminator:
    enabled: false
    input_source: "stacked_observation"   # stacked_observation / observation
    policy_file: "policies/amp_discriminator.onnx"
    policy_io:
      obs_input_name: "obs"
      score_output_name: "disc_score"
      enable_time_step_input: false
      time_step_input_name: "time_step"
      time_step_start: 0
      strict_model_io: false
      enable_metadata_check: false
      metadata_check_strict: true
      required_metadata_keys: []
      expected_metadata: {}
      extra_output_names: []
      warn_below: -1.0e9
  # Optional multi-model ensemble:
  # sub_models:
  #   - name: residual_head
  #     enabled: true
  #     weight: 0.35
  #     policy_file: "policies/residual_head.onnx"
  #     policy_io:
  #       obs_input_name: "obs"
  #       action_output_name: "actions"
  #       enable_time_step_input: false
  enable_cmd_watchdog: true
  cmd_timeout_s: 0.12
  loop_overrun_warn_us: 2000
  enable_state_telemetry: true
  state_telemetry_hz: 50.0
  auto_start_policy: true
  zeroing_duration_s: 2.0
  
  tau_limit: [130.0, 130.0, 130.0, 130.0, 130.0, 130.0, 130.0, 130.0, 130.0, 130.0, 130.0, 130.0]
  
  control_mode: "sim2real"
  action_filter: 0.5
  
  robot:
