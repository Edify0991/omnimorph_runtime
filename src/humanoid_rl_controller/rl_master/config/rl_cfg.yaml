    - right_shoulder_roll
    - right_shoulder_yaw
    - right_elbow_pitch
  obs_joint_order:
    - right_hip_roll
    - right_hip_yaw
    - right_hip_pitch
    - right_knee_pitch
    - right_ankle_pitch
    - right_ankle_roll
    - left_hip_roll
    - left_hip_yaw
    - left_hip_pitch
    - left_knee_pitch
    - left_ankle_pitch
    - left_ankle_roll
    - left_shoulder_pitch
    - left_shoulder_roll
    - left_shoulder_yaw
    - left_elbow_pitch
    - right_shoulder_pitch
    - right_shoulder_roll
    - right_shoulder_yaw
    - right_elbow_pitch

  onnx_intra_threads: 1
  onnx_inter_threads: 1
  policy_io:
    obs_input_name: "obs"
    action_output_name: "actions"
    enable_time_step_input: false
    time_step_input_name: "time_step"
    time_step_start: 0
    strict_model_io: false
    enable_metadata_check: true
