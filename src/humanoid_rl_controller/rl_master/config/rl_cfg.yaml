# RL Configuration File

humanoid_rl_root_dir: "/home/nvidia/Documents/humanoid_jc/src/humanoid_rl_controller/rl_master"
legged_gym_root_dir: "/path/to/legged_gym_root_dir"

# walk_mode DDS control words (generic):
# start specific mode: 1000 + mode_id
# set specific mode only: 2000 + mode_id
# lifecycle controls (canonical): 10=START_POLICY, 11=STOP_POLICY, 12=ZEROING, 13=ESTOP
# lifecycle controls (legacy, still accepted): 3001/3002/3003/3004
# note: direct mode switch by plain mode_id is disabled to avoid ambiguity

# Generic mode -> policy profile map. Add new mode_id entries for new scenes/models
# without changing controller source code.
deploy_mode_profiles:
  - mode_id: 0
    config_section: sim2real
    tag: walk
  - mode_id: 1
    config_section: stand_sim2real
    tag: stand

# Process-level realtime overrides for thread scheduling and CPU affinity.
# These override per-profile `realtime` when present.
runtime_process:
  controller:
    enabled: true
    lock_memory: true
    set_affinity: true
    cpu_id: 3
    use_fifo: true
    fifo_priority: 90
  solver:
    enabled: true
    lock_memory: true
    set_affinity: true
    cpu_id: 2
    use_fifo: true
    fifo_priority: 90

sim2real:
  policy_name: "2026-01-11_01-27-10"
  policy_family: "amp"  # amp / beyondmimic / custom
  obs_stack_N: 15
  # cycle_time: 1.05
  cycle_time: 1.0
  
  # PD controller gains

  # test pd
  kps:  [200, 120, 150, 300, 20, 20, 200, 120, 150, 300, 20, 20]   
  kds:  [5, 3, 5, 10, 2, 2, 5, 3, 5, 10, 2, 2]

  clip_observations: 100.0
  clip_actions: 100.0
  action_scale: 0.5
  
  device_id: 0
  obs_dim: 47
  action_dim: 12
  motor_N: 12
  RL_control_f: 100
  realtime:
    enabled: true
    lock_memory: true
    set_affinity: true
    cpu_id: 3
    use_fifo: true
    fifo_priority: 90
  # policy action output order. If omitted, default is robot canonical order.
  action_joint_order:
    - right_hip_roll
    - right_hip_yaw
    - right_hip_pitch
    - right_knee_pitch
    - right_ankle_pitch
    - right_ankle_roll
    - left_hip_roll_joint
    - left_hip_yaw
    - left_hip_pitch
    - left_knee_pitch
    - left_ankle_pitch
    - left_ankle_roll
  obs_joint_order:
    - right_hip_roll
    - right_hip_yaw
    - right_hip_pitch
    - right_knee_pitch
    - right_ankle_pitch
    - right_ankle_roll
    - left_hip_roll
    - left_hip_yaw
    - left_hip_pitch
    - left_knee_pitch
    - left_ankle_pitch
    - left_ankle_roll
  # Example (IsaacLab left-first style), replace above list if needed:
  # action_joint_order:
  #   - left_hip_roll
  #   - left_hip_yaw
  #   - left_hip_pitch
  #   - left_knee_pitch
  #   - left_ankle_pitch
  #   - left_ankle_roll
  #   - right_hip_roll
  #   - right_hip_yaw
  #   - right_hip_pitch
  #   - right_knee_pitch
  #   - right_ankle_pitch
  #   - right_ankle_roll
  # obs_joint_order can use the same left-first list as action_joint_order.
  observation_manifest_file: "observation_manifest_amp.yaml"
  # beyondmimic example:
  # policy_family: "beyondmimic"
  # observation_manifest_file: "observation_manifest_beyondmimic.yaml"
  # obs_dim: 71
  enable_reference_motion: false
  reference_motion_dim: 24
  reference_motion_sampling: "phase"   # phase / step
  reference_motion_source: "auto"      # auto / file / policy_outputs
  reference_motion_file: "reference_motion/walk_ref.txt"
  reference_anchor_body: "base"
  reference_body_names: []             # e.g. ["base", "left_foot", "right_foot"]
  external_observations:
    - name: vision_latent
      dim: 64
      required: false
    - name: lidar_latent
      dim: 32
      required: false
    # Optional (BeyondMimic robot body local terms):
    # - name: robot_body_pos_w   # shape: 3 * body_count
    #   dim: 24
    #   required: false
    # - name: robot_body_quat_w  # shape: 4 * body_count, xyzw
    #   dim: 32
    #   required: false
  onnx_intra_threads: 1
  onnx_inter_threads: 1
  policy_io:
    obs_input_name: "obs"
    action_output_name: "actions"
    enable_time_step_input: false
    time_step_input_name: "time_step"
    time_step_start: 0
    strict_model_io: false
    reset_policy_on_mode_switch: true
    extra_output_names: []
    # Example for beyondmimic-style exported policy:
    # obs_input_name: "obs"
    # action_output_name: "action"
    # enable_time_step_input: true
    # time_step_input_name: "time_step"
    # extra_output_names: ["joint_pos", "joint_vel", "body_pos_w", "body_quat_w"]
  amp_discriminator:
    enabled: false
    input_source: "stacked_observation"   # stacked_observation / observation
    policy_file: "policies/amp_discriminator.onnx"
    policy_io:
      obs_input_name: "obs"
      score_output_name: "disc_score"
      enable_time_step_input: false
      time_step_input_name: "time_step"
      time_step_start: 0
      strict_model_io: false
      extra_output_names: []
      warn_below: -1.0e9
  # Optional multi-model ensemble:
  # sub_models:
  #   - name: residual_head
  #     enabled: true
  #     weight: 0.35
  #     policy_file: "policies/residual_head.onnx"
  #     policy_io:
  #       obs_input_name: "obs"
  #       action_output_name: "actions"
  #       enable_time_step_input: false
  enable_cmd_watchdog: true
  cmd_timeout_s: 0.12
  loop_overrun_warn_us: 2000
  auto_start_policy: true
  zeroing_duration_s: 2.0
  # zero_pose: [0.0, 0.0, -0.24, 0.48, -0.24, 0.0, 0.0, 0.0, -0.24, 0.48, -0.24, 0.0]
  
  tau_limit: [130.0, 130.0, 130.0, 130.0, 130.0, 130.0, 130.0, 130.0, 130.0, 130.0, 130.0, 130.0]
  
  save_data_flag: true
  control_mode: "sim2real"
  action_filter: 0.5
  
  robot:
    default_joint_angles:
      right_hip_roll: 0.0
      right_hip_yaw: 0.0
      right_hip_pitch: -0.24
      right_knee_pitch: 0.48
      right_ankle_pitch: -0.24
      right_ankle_roll: 0.0
      left_hip_roll: 0.0
      left_hip_yaw: 0.0
      left_hip_pitch: -0.24
      left_knee_pitch: 0.48
      left_ankle_pitch: -0.24
      left_ankle_roll: 0.0
    
    joint_limit_range:
      hip_roll: [-0.2, 0.2]
      hip_yaw: [-1.05, 1.05]
      hip_pitch: [-0.45, 0.38]
      knee_pitch: [0.0, 1.48]
      ankle_pitch: [-0.64, 0.4]
      ankle_roll: [-0.26, 0.26]
      # hip_linear_motor: [0, 200]
      # knee_linear_motor: [0, 200]
      # ankle_left_linear_motor: [0, 100]
      # ankle_right_linear_motor: [0, 100]
    
    motor_torque_limit:
      hip_roll: 330
      hip_yaw: 150
      hip_pitch: 330
      knee_pitch: 8000
      ankle_pitch: 90
      ankle_roll: 90
  
  scales:
    lin_vel: 2.0
    ang_vel: 1.0
    dof_pos: 1.0
    dof_vel: 0.05
    quat: 1.0
    height_measurements: 5.0

